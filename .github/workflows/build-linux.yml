name: Build and Upload .NET Project

on:
  push:
    branches: [ develop ]
  pull_request:

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        # os: [ubuntu-latest, windows-latest, macos-latest]
        # include:
        #   - os: ubuntu-latest
        #     rid: linux-x64
        #   - os: windows-latest
        #     rid: win-x64
        #   - os: macos-latest
        #     rid: osx-x64
        os: [windows-latest]
        include:
          - os: windows-latest
            rid: win-x64

    steps:
      # Step 1: Checkout current repo
      - name: Checkout current repository
        uses: actions/checkout@v4
        with:
          path: repo

      # Step 2: Setup .NET
      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '3.1.x'

      # Step 3: Clone dependent repositories
      - name: Clone dependent repositories
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            # Windows
            pwsh -Command "New-Item -ItemType Directory -Force -Path horizon-server, horizon-deadlocked-patch"
            git clone https://github.com/Horizon-Private-Server/horizon-server.git horizon-server
            git clone https://github.com/Horizon-Private-Server/horizon-deadlocked-patch.git horizon-deadlocked-patch
          else
            # macOS/Linux
            mkdir -p horizon-server horizon-deadlocked-patch
            git clone https://github.com/Horizon-Private-Server/horizon-server.git horizon-server
            git clone https://github.com/Horizon-Private-Server/horizon-deadlocked-patch.git horizon-deadlocked-patch
          fi

      - name: Restore and build dependencies
        working-directory: horizon-server
        run: |
          dotnet restore
          dotnet build --configuration Debug --no-restore

      # Step 4: Restore and build
      - name: Restore dependencies
        working-directory: repo
        run: dotnet restore

      - name: Build
        working-directory: repo
        run: dotnet build --configuration Release --no-restore

      # Step 5: Publish self-contained binaries
      - name: Publish for ${{ matrix.os }}
        working-directory: repo
        run: |
          dotnet publish \
            --configuration Release \
            --runtime ${{ matrix.rid }} \
            --output ../output/${{ matrix.rid }}

      # Step 6: Upload binaries as an artifact
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.rid }}
          path: output/${{ matrix.rid }}/
